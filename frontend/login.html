<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Madhan Mart account. Multi-role access for Buyers, Sellers, and Admins.">
  <title>Login - MADHAN MART (3-Role System)</title>
  
  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="login.css?v=4">
</head>
<body>
  <!-- Interactive Mouse-Tracking Spotlight Glow & Crisp Grid -->
  <div class="bg-grid-pattern" aria-hidden="true"></div>
  <div class="cursor-glow-halo" id="cursorGlowHalo" aria-hidden="true"></div>
  <div class="cursor-glow-beam" id="cursorGlowBeam" aria-hidden="true"></div>

  <!-- Main Container -->
  <main class="login-wrapper">
    <div class="login-card" id="loginCard">
      
      <!-- Brand Header -->
      <header class="brand-header">
        <a href="/" class="brand-logo" aria-label="MADHAN MART Home">
          <div class="logo-icon-wrap">
            <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.1"/>
              <path d="M8 10.5C8 9.67157 8.67157 9 9.5 9H22.5C23.3284 9 24 9.67157 24 10.5V23.5C24 24.3284 23.3284 25 22.5 25H9.5C8.67157 25 8 24.3284 8 23.5V10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 9V7C12 4.79086 13.7909 3 16 3V3C18.2091 3 20 4.79086 20 7V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11 14H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 14V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="brand-name">MADHAN <span class="brand-highlight">MART</span></span>
        </a>
        <p class="brand-tagline">Multi-Role Commerce Platform</p>
      </header>

      <!-- 3-Role Interactive Switcher -->
      <div class="role-selector-container">
        <span class="role-selector-label">Choose Your Role</span>
        <div class="role-toggle-group" role="tablist" aria-label="Select Login Role">
          <button type="button" class="role-tab active" data-role="buyer" id="roleTabBuyer" role="tab" aria-selected="true">
            <span class="role-tab-icon">🛒</span>
            <span class="role-tab-title">Buyer</span>
          </button>
          <button type="button" class="role-tab" data-role="seller" id="roleTabSeller" role="tab" aria-selected="false">
            <span class="role-tab-icon">🏪</span>
            <span class="role-tab-title">Seller</span>
          </button>
          <button type="button" class="role-tab" data-role="admin" id="roleTabAdmin" role="tab" aria-selected="false">
            <span class="role-tab-icon">🛡️</span>
            <span class="role-tab-title">Admin</span>
          </button>
        </div>
      </div>

      <!-- Quick 1-Click Demo Login Bar -->
      <div class="quick-demo-banner" id="quickDemoBanner">
        <div class="demo-info">
          <span class="demo-badge" id="demoBadge">Buyer Access</span>
          <span class="demo-hint" id="demoHint">Instant test login with 1 click</span>
        </div>
        <button type="button" class="btn-quick-demo" id="btnQuickDemo">
          ⚡ 1-Click Demo
        </button>
      </div>

      <!-- Welcome Headings -->
      <div class="login-title-section">
        <h1 class="login-title" id="loginTitle">Buyer Sign In</h1>
        <p class="login-subtitle" id="loginSubtitle">Enter your credentials to browse & place orders</p>
      </div>

      <!-- Alert Message Box (for feedback/errors) -->
      <div id="formAlert" class="form-alert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate>
        
        <!-- Email Input Group -->
        <div class="form-group" id="emailGroup">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.5 5.83337C2.5 4.9129 3.24619 4.16671 4.16667 4.16671H15.8333C16.7538 4.16671 17.5 4.9129 17.5 5.83337V14.1667C17.5 15.0872 16.7538 15.8334 15.8333 15.8334H4.16667C3.24619 15.8334 2.5 15.0872 2.5 14.1667V5.83337Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2.5 6.66671L10 11.25L17.5 6.66671" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="buyer@madhanmart.com" 
              autocomplete="email" 
              required 
              aria-describedby="emailError"
            >
          </div>
          <span class="error-text" id="emailError"></span>
        </div>

        <!-- Password Input Group -->
        <div class="form-group" id="passwordGroup">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3.33334" y="9.16667" width="13.3333" height="8.33333" rx="2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.83334 9.16667V6.66667C5.83334 4.36548 7.69882 2.5 10 2.5C12.3012 2.5 14.1667 4.36548 14.1667 6.66667V9.16667" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="10" cy="13.3333" r="1.25" fill="currentColor"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required 
              aria-describedby="passwordError"
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="password-toggle-btn" 
              aria-label="Show password" 
              aria-pressed="false"
            >
              <svg class="eye-icon eye-open" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.66666 10C1.66666 10 4.99999 4.16667 10 4.16667C15 4.16667 18.3333 10 18.3333 10C18.3333 10 15 15.8333 10 15.8333C4.99999 15.8333 1.66666 10 1.66666 10Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 12.5C11.3807 12.5 12.5 11.3807 12.5 10C12.5 8.61929 11.3807 7.5 10 7.5C8.61928 7.5 7.49999 8.61929 7.49999 10C7.49999 11.3807 8.61928 12.5 10 12.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="eye-icon eye-closed" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.5 2.5L17.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8.70834 8.70834C8.30327 9.11341 8.07548 9.66286 8.07548 10.2358C8.07548 10.8087 8.30327 11.3582 8.70834 11.7632C9.11341 12.1683 9.66286 12.3961 10.2358 12.3961C10.8087 12.3961 11.3582 12.1683 11.7632 11.7632" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.5 5.5C3.80556 6.74591 2.51866 8.31977 1.66666 10C1.66666 10 4.99999 15.8333 10 15.8333C12.0195 15.8333 13.8821 15.0766 15.4167 13.8333" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8.25 4.33333C8.82562 4.22384 9.40879 4.16788 10 4.16667C15 4.16667 18.3333 10 18.3333 10C17.7854 11.0827 17.0735 12.0622 16.2222 12.8889" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <span class="error-text" id="passwordError"></span>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-container" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <span class="custom-checkbox" aria-hidden="true">
              <svg viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 5L4.5 8L10.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="checkbox-label">Remember me</span>
          </label>
          
          <a href="#forgot-password" class="forgot-password-link" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginBtn" class="btn-login">
          <span class="btn-label">Login as Buyer</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

      </form>

      <!-- Card Footer -->
      <footer class="card-footer">
        <p class="signup-prompt" id="signupPromptContainer">
          Don’t have an account? 
          <a href="register.html?role=buyer" class="create-account-link" id="createAccountLink">Create Buyer Account</a>
        </p>
      </footer>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="login.js?v=4"></script>
</body>
</html>
